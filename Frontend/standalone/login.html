<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Login - GoBus</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: #f1f5f9;">

  <header class="gobus-header">
    <div class="container header-container">
      <a href="index.html" class="brand-wordmark">
        <span>GoBus</span>
      </a>
      <div class="header-actions">
        <a href="index.html" class="btn btn-outline btn-sm">Back to Home</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-badge auth-badge-passenger">Passenger Portal</span>
        <h1>Welcome Back</h1>
        <p>Sign in to your passenger account to view tickets, manage trips, and cancel bookings.</p>
      </div>

      <!-- Exclusively Passenger Login Form: No operator or admin options -->
      <form id="passengerLoginForm" class="auth-form" action="user-dashboard.html" method="GET">
        <div class="form-group">
          <label for="loginEmail">Email Address or Mobile Number</label>
          <input type="text" id="loginEmail" name="email" class="form-control" placeholder="name@example.com or +91..." value="rahul.sharma@example.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" value="password123" required>
        </div>

        <div class="form-extra">
          <label class="checkbox-label">
            <input type="checkbox" checked>
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link" onclick="alert('Demo: Password reset link will be sent via SMS/Email when Java backend is connected.'); return false;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; height: 44px; margin-top: 6px;">Sign In</button>
      </form>

      <div class="demo-credentials-box">
        <strong>Demo Passenger Account:</strong><br>
        Email: <code>rahul.sharma@example.com</code><br>
        Password: <code>password123</code>
      </div>

      <div class="auth-footer">
        Don't have a GoBus account? <a href="register.html">Register here</a>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
